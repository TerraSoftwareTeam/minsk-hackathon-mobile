name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  # Repository variable (or secret) with the API base URL baked into BuildConfig.
  BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest :koverXmlReport :koverHtmlReport --continue --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/html/
            build/reports/kover/report.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f build/reports/kover/report.xml ]; then
            echo "Coverage report was not generated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          report = ET.parse("build/reports/kover/report.xml").getroot()
          line = next(c for c in report.findall("counter") if c.get("type") == "LINE")
          covered = int(line.get("covered"))
          missed = int(line.get("missed"))
          total = covered + missed
          percent = round(100 * covered / total, 1) if total else 0.0
          print(f"### Coverage\n\n| Metric | Value |\n| --- | --- |\n| Lines | {percent}% ({covered}/{total}) |")
          PY

  release:
    name: Build & Publish Release
    needs: test
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured in repository settings"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::BASE_URL is not configured. The APK will use the default http://10.0.2.2:8080/"
          fi

          ./gradlew assembleRelease \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PBASE_URL="$BASE_URL" \
            --stacktrace --console=plain

      - name: Prepare and verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Signed app-release.apk was not produced. Check signing configuration."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning::apksigner not found, skipping signature verification"
          fi

          mkdir -p dist
          cp "$APK" "dist/lbsuhack-v${VERSION_NAME}.apk"
          echo "Prepared dist/lbsuhack-v${VERSION_NAME}.apk"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbsuhack-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Lbsuhack v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        run: |
          {
            echo "### Release v${VERSION_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| versionName | \`${VERSION_NAME}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| APK | \`lbsuhack-v${VERSION_NAME}.apk\` |"
          } >> "$GITHUB_STEP_SUMMARY"
