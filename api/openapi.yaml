openapi: 3.0.0
paths:
  /api/v1:
    get:
      description: Plain-text greeting; use GET /health to check the service.
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: Greeting text
          content:
            application/json:
              schema:
                type: string
                example: Hello World!!
      summary: Greeting
      tags:
      - App
  /api/v1/health:
    get:
      operationId: HealthController_healthcheck
      parameters: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
      summary: Health check
      tags:
      - Health
  /api/v1/auth/register:
    post:
      description: Creates a user and returns a JWT access token. Public endpoint, no auth required.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
            examples:
              pupil:
                summary: Pupil
                value:
                  schoolsById: school-user-123
                  name: Ivan
                  surname: Ivanov
                  role: PUPIL
                  class: 10A
              teacher:
                summary: Teacher
                value:
                  schoolsById: school-user-456
                  name: Maria
                  surname: Sidorova
                  role: TEACHER
                  class: 10A
      responses:
        '201':
          description: User created; JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation failed (missing/invalid fields, blank class, unknown fields), or a PUPIL
            registers into a class that has no teacher
        '409':
          description: User with this schoolsById already exists
      summary: Register a new user
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: PUPIL and TEACHER log in by schoolsById; ADMIN logs in by id. Admins cannot register,
        only log in. Public endpoint, no auth required.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              pupil:
                summary: Pupil or teacher
                value:
                  role: PUPIL
                  schoolsById: school-user-123
              admin:
                summary: Admin
                value:
                  role: ADMIN
                  id: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
      responses:
        '200':
          description: JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation failed (missing schoolsById or id for the role)
        '401':
          description: No user with this role and identifier
        '403':
          description: PUPIL or TEACHER has no class assigned
      summary: Log in
      tags:
      - Auth
  /api/v1/users:
    post:
      description: 'Admin: any role (PUPIL/TEACHER need schoolsById and class; ADMIN must not have them).
        Teacher: PUPIL only, class is taken from the teacher. Pupil: forbidden.'
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
            examples:
              teacherCreatesPupil:
                summary: Teacher creates a pupil of own class
                value:
                  schoolsById: school-user-789
                  name: Petr
                  surname: Petrov
                  role: PUPIL
              adminCreatesAdmin:
                summary: Admin creates an admin
                value:
                  name: Anna
                  surname: Admin
                  role: ADMIN
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed or school fields do not match the role
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not create this user
        '409':
          description: User with this schoolsById already exists
      security:
      - bearer: []
      summary: Create a user
      tags:
      - Users
    get:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_findAll
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: List users the caller can manage
      tags:
      - Users
  /api/v1/users/{id}:
    get:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
      security:
      - bearer: []
      summary: Get a user by id
      tags:
      - Users
    patch:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.
        Only an admin can change role, class, schoolsById; others change name, surname.'
      operationId: UsersController_update
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or validation failed, or school fields do not match
            the role'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not change this user or these fields
        '404':
          description: User not found
        '409':
          description: User with this schoolsById already exists
      security:
      - bearer: []
      summary: Update a user
      tags:
      - Users
    delete:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_remove
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
        '409':
          description: User is referenced by other records (e.g. created or moderates events)
      security:
      - bearer: []
      summary: Delete a user
      tags:
      - Users
  /api/v1/events:
    post:
      description: 'Pupil only. The event gets status ON_MODERATION and is sent to the teacher of the
        pupil''s class. votingClosesAt (startsAt - 2 days) is computed: moderation and voting must finish
        by then.'
      operationId: EventsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: Validation failed (incl. startsAt without a timezone), startsAt is not more than
            2 days ahead, or the pupil's class has no teacher
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '409':
          description: Event with this name already exists
      security:
      - bearer: []
      summary: Create an event request
      tags:
      - Events
  /api/v1/events/probability:
    get:
      description: 'Any authenticated user. Computed from events of the same category that are FINALIZED
        (success) or EXPIRED (failure), even if they have not started yet; declined and pending events
        are ignored. Only the start time of day (Minsk time) is compared, not the date. At least 5 such
        events at the same time, all successful: 0.9; no history: 0.5.'
      operationId: EventsController_previewProbability
      parameters:
      - name: category
        required: true
        in: query
        description: Kind of event
        schema:
          example: SPORTS
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
      - name: startsAt
        required: true
        in: query
        description: 'Planned start: ISO 8601 date-time with a timezone (Z or ±hh:mm). In a URL encode
          "+" as %2B, e.g. 2026-12-05T12:00:00%2B03:00'
        schema:
          format: date-time
          example: '2026-12-05T12:00:00+03:00'
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityResponseDto'
        '400':
          description: Invalid category, or startsAt is not a date-time with a timezone
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Preview the probability that an event takes place
      tags:
      - Events
  /api/v1/events/moderation:
    get:
      description: Teacher only. Events assigned to the caller with status ON_MODERATION, oldest first.
        Events past their voting deadline are hidden.
      operationId: EventsController_findForModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a teacher
      security:
      - bearer: []
      summary: Teacher's moderation list
      tags:
      - Events
  /api/v1/events/my:
    get:
      description: Pupil only. All events created by the caller, in any status, newest first, with the
        vote count.
      operationId: EventsController_findMine
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
      - bearer: []
      summary: Author's own events
      tags:
      - Events
  /api/v1/events/voting:
    get:
      description: 'Pupil only. ON_VOTE events whose scope includes the caller (relative to the initiator''s
        class: CLASS - same class, GRADE - same grade, SCHOOL - any pupil) and whose voting is still open,
        newest first, with the vote count and whether the caller has voted.'
      operationId: EventsController_findForVoting
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
      - bearer: []
      summary: Pupil's voting list
      tags:
      - Events
  /api/v1/events/for-rating:
    get:
      description: 'Pupil only. Events of any class and scope approved by the teacher: ON_VOTE, ON_ADMIN_MODERATION,
        FINALIZED, DECLINED_BY_ADMIN. Newest first, with the caller''s own rating (myRating, null if not
        rated yet).'
      operationId: EventsController_findForRating
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
      - bearer: []
      summary: Pupil's rating list
      tags:
      - Events
  /api/v1/events/admin-moderation:
    get:
      description: Admin only. Events with status ON_ADMIN_MODERATION (passed the vote), oldest first.
        Events that have already started are hidden.
      operationId: EventsController_findForAdminModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
      security:
      - bearer: []
      summary: Admin's moderation list
      tags:
      - Events
  /api/v1/events/{id}:
    get:
      description: Initiator, assigned teacher or admin.
      operationId: EventsController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not read this event
        '404':
          description: Event not found
      security:
      - bearer: []
      summary: Get an event with all its data
      tags:
      - Events
  /api/v1/events/{id}/approve:
    post:
      description: Assigned teacher only. ON_MODERATION -> ON_VOTE.
      operationId: EventsController_approve
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the assigned teacher
        '404':
          description: Event not found
        '409':
          description: Event is not on moderation anymore, or voting for it has closed (2 days before
            the start)
      security:
      - bearer: []
      summary: Approve an event
      tags:
      - Events
  /api/v1/events/{id}/decline:
    post:
      description: Assigned teacher only. ON_MODERATION -> DECLINED, with an optional reason.
      operationId: EventsController_decline
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or reason is empty or longer than 2000 characters'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the assigned teacher
        '404':
          description: Event not found
        '409':
          description: Event is not on moderation anymore, or voting for it has closed (2 days before
            the start)
      security:
      - bearer: []
      summary: Decline an event
      tags:
      - Events
  /api/v1/events/{id}/admin/approve:
    post:
      description: Admin only. ON_ADMIN_MODERATION -> FINALIZED.
      operationId: EventsController_adminApprove
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or has already started
      security:
      - bearer: []
      summary: Admin approves an event
      tags:
      - Events
  /api/v1/events/{id}/admin/decline:
    post:
      description: Admin only. ON_ADMIN_MODERATION -> DECLINED_BY_ADMIN, with an optional reason.
      operationId: EventsController_adminDecline
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or reason is empty or longer than 2000 characters'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or has already started
      security:
      - bearer: []
      summary: Admin declines an event
      tags:
      - Events
  /api/v1/events/{id}/image:
    put:
      description: 'Author only, while the event is pending (ON_MODERATION, ON_VOTE, ON_ADMIN_MODERATION)
        and not past its deadline. An event has at most one image: a new upload replaces and deletes the
        previous one. multipart/form-data, field "file": image/jpeg, image/png, image/webp, image/gif,
        up to 5 MB; the type is checked by the file content.'
      operationId: EventsController_setImage
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP or GIF, up to 5 MB
      responses:
        '200':
          description: The event with its new imageUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or the file is missing, or is not a JPEG/PNG/WebP/GIF
            image'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the author
        '404':
          description: Event not found
        '409':
          description: The event is already decided (or past its deadline)
        '413':
          description: File is larger than 5 MB
        '502':
          description: The image storage (Cloudinary) rejected the upload
      security:
      - bearer: []
      summary: Set or replace the event image
      tags:
      - Events
    delete:
      description: Author while the event is pending and not past its deadline; an admin in any status.
        Does nothing if the event has no image.
      operationId: EventsController_removeImage
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: The event, imageUrl is null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is neither the author nor an admin
        '404':
          description: Event not found
        '409':
          description: 'Author: the event is already decided (or past its deadline)'
      security:
      - bearer: []
      summary: Remove the event image
      tags:
      - Events
  /api/v1/events/{id}/vote:
    post:
      description: 'Pupil only. The event must be ON_VOTE and voting must be open (until 2 days before
        the start). One vote per pupil per event. Audience by scope, relative to the initiator''s class:
        CLASS - same class, GRADE - same grade (first number of the class name), SCHOOL - any pupil. The
        vote that reaches voteThreshold moves the event to ON_ADMIN_MODERATION.'
      operationId: EventsController_vote
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventVoteResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil, or is outside the event's scope
        '404':
          description: Event not found
        '409':
          description: Event is not on vote, voting has closed (2 days before the start), or the pupil
            has already voted
      security:
      - bearer: []
      summary: Vote for an event
      tags:
      - Events
  /api/v1/events/{id}/rating:
    put:
      description: 'Pupil only, any pupil: the event scope does not limit who rates. The event must be
        approved by the teacher: ON_VOTE, ON_ADMIN_MODERATION, FINALIZED or DECLINED_BY_ADMIN. One rating
        per pupil per event: calling again changes it.'
      operationId: EventsController_rate
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRatingResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or stars is not an integer from 1 to 5'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '404':
          description: Event not found
        '409':
          description: Event is ON_MODERATION, DECLINED or EXPIRED
      security:
      - bearer: []
      summary: Rate an event (1 to 5 stars)
      tags:
      - Events
  /api/v1/device-token:
    post:
      description: Call on login and on every app start. Any role. A token registered by another user
        moves to the caller. With deviceId, a previous token of the same device is replaced.
      operationId: DeviceTokensController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceTokenDto'
      responses:
        '204':
          description: Saved
        '400':
          description: Validation failed
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Save or refresh the FCM token of this device
      tags:
      - Push notifications
    delete:
      description: Call on logout, before dropping the JWT, so the device stops getting this user's pushes.
        The token is sent in the JSON body. Idempotent.
      operationId: DeviceTokensController_remove
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDeviceTokenDto'
      responses:
        '204':
          description: Deleted, or there was no such token of the caller
        '400':
          description: Validation failed
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Delete the FCM token of this device
      tags:
      - Push notifications
info:
  title: Minsk Hackathon Backend
  description: Backend documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: Health check status
      required:
      - ok
    RegisterDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: User ID in the school system (unique)
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          example: PUPIL
          description: User role (PUPIL or TEACHER)
        class:
          type: string
          example: 10A
          description: Class name; surrounding spaces are trimmed, must not be blank
      required:
      - schoolsById
      - name
      - surname
      - role
      - class
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        schoolsById:
          type: string
          example: school-user-123
          nullable: true
          description: User ID in the school system; null for ADMIN
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        class:
          type: string
          example: 10A
          nullable: true
          description: Class; always set for PUPIL and TEACHER, null for ADMIN
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: User role
      required:
      - id
      - schoolsById
      - name
      - surname
      - class
      - role
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjJjIn0.signature
          description: 'JWT access token: send it as "Authorization: Bearer <token>"'
        user:
          description: The logged-in user
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
      required:
      - accessToken
      - user
    LoginDto:
      type: object
      properties:
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: Role of the user logging in
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID. Required for PUPIL and TEACHER
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
          description: User id (UUID). Required for ADMIN
      required:
      - role
    CreateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID (unique). Required for PUPIL/TEACHER, forbidden for ADMIN
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to the teacher's
            class. Surrounding spaces are trimmed, must not be blank
      required:
      - name
      - surname
      - role
    UpdateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID (unique). Required for PUPIL/TEACHER, forbidden for ADMIN
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to the teacher's
            class. Surrounding spaces are trimmed, must not be blank
    CreateEventDto:
      type: object
      properties:
        name:
          type: string
          example: Class trip to the museum
          maxLength: 200
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          maxLength: 5000
          description: Free-form details
        scope:
          type: string
          enum:
          - CLASS
          - GRADE
          - SCHOOL
          default: CLASS
          description: 'Who may vote, relative to the author''s class: CLASS - same class, GRADE - same
            grade (first number of the class name), SCHOOL - any pupil'
        category:
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
          example: SPORTS
          description: 'Kind of event: SPORTS - competitions, tournaments; INTELLECTUAL - olympiads, quizzes,
            debates; CULTURAL - theatre, museum, cinema; CREATIVE - concerts, contests, exhibitions; EDUCATIONAL
            - lectures, workshops; VOLUNTEER - charity, social help; ENVIRONMENTAL - clean-ups, tree planting;
            TOURISM - hikes, excursions, trips; ENTERTAINMENT - celebrations, discos, quests; OTHER -
            anything else'
        voteThreshold:
          type: integer
          example: 15
          minimum: 1
          maximum: 10000
          description: Votes needed during ON_VOTE to send the event to admin moderation
        startsAt:
          type: string
          example: '2026-12-01T10:00:00+03:00'
          format: date-time
          description: 'When the event starts: ISO 8601 date-time with a timezone (Z or ±hh:mm), more
            than 2 days ahead. Voting closes 2 days before it: an event not approved and voted by then
            becomes EXPIRED. The admin may decide on a voted event until it starts'
      required:
      - name
      - category
      - voteThreshold
      - startsAt
    EventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        name:
          type: string
          example: Class trip to the museum
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          nullable: true
          description: Free-form details
        scope:
          type: string
          enum:
          - CLASS
          - GRADE
          - SCHOOL
          example: CLASS
          description: 'Who may vote, relative to the author''s class: CLASS, GRADE or SCHOOL'
        category:
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
          example: SPORTS
          description: Kind of event
        status:
          type: string
          enum:
          - ON_MODERATION
          - DECLINED
          - ON_VOTE
          - EXPIRED
          - ON_ADMIN_MODERATION
          - FINALIZED
          - DECLINED_BY_ADMIN
          example: ON_MODERATION
          description: 'ON_MODERATION (teacher) -> ON_VOTE (pupils) -> ON_ADMIN_MODERATION (admin) ->
            FINALIZED. DECLINED / DECLINED_BY_ADMIN: rejected by the teacher / admin. EXPIRED: not decided
            before its deadline'
        declineReason:
          type: string
          example: null
          nullable: true
          description: Set when declined (by the teacher or an admin) with a reason
        voteThreshold:
          type: integer
          example: 15
          description: Votes needed to move from ON_VOTE to ON_ADMIN_MODERATION
        startsAt:
          format: date-time
          type: string
          example: '2026-12-01T07:00:00.000Z'
          description: When the event starts (UTC)
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-11-29T07:00:00.000Z'
          description: 'Computed: 2 days before startsAt. Voting and teacher moderation must finish by
            then, otherwise the event becomes EXPIRED'
        successProbability:
          type: number
          example: 0.66
          minimum: 0
          maximum: 1
          description: 'Computed: probability (0..1) that the event takes place, from other events of
            the same category with a known outcome (also not yet started ones): how close their start
            time of day (Minsk time) is and whether they were FINALIZED or EXPIRED. Declined and pending
            events are not counted. 0.9 when at least 5 such events all started at the same time and all
            took place; 0.5 without history'
        imageUrl:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/v1/minsk_hackathon_images/3f2c9a4e.jpg
          nullable: true
          description: Event image URL; null when the event has none. At most one image per event
        ratingAverage:
          type: number
          example: 4.33
          nullable: true
          minimum: 1
          maximum: 5
          description: Average stars (1..5, 2 decimals) of the pupils who rated the event; null until
            the first rating
        ratingsCount:
          type: integer
          example: 3
          description: Number of ratings. Any pupil may rate an event from ON_VOTE on
        initiator:
          description: Pupil who created the event
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
        teacher:
          description: Teacher who moderates the event
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
        createdAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: When the request was created (UTC)
        updatedAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: Last change (UTC)
      required:
      - id
      - name
      - description
      - scope
      - category
      - status
      - declineReason
      - voteThreshold
      - startsAt
      - votingClosesAt
      - successProbability
      - imageUrl
      - ratingAverage
      - ratingsCount
      - initiator
      - teacher
      - createdAt
      - updatedAt
    ProbabilityResponseDto:
      type: object
