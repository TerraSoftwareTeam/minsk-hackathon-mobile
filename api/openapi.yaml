          type: string
          example: '2026-12-01T07:00:00.000Z'
          description: When the event starts (UTC)
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-11-29T07:00:00.000Z'
          description: 'Computed: 2 days before startsAt. Voting and teacher moderation must finish by
