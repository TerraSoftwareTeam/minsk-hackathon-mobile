openapi: 3.0.0
paths:
  /api/v1:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /api/v1/health:
    get:
      operationId: HealthController_healthcheck
      parameters: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
      summary: Health check
      tags:
        - Health
  /api/v1/auth/register:
    post:
      description: >-
        Creates a user and returns a JWT access token. Public endpoint, no auth
        required.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
            examples:
              pupil:
                summary: Pupil
                value:
                  schoolsById: school-user-123
                  name: Ivan
                  surname: Ivanov
                  fathersName: Petrovich
                  role: PUPIL
                  class: 10A
              teacher:
                summary: Teacher
                value:
                  schoolsById: school-user-456
                  name: Maria
                  surname: Sidorova
                  fathersName: Ivanovna
                  role: TEACHER
                  class: 10A
      responses:
        '201':
          description: User created; JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: >-
            Validation failed (missing/invalid fields), or a PUPIL registers
            into a class that has no teacher
        '409':
          description: User with this schoolsById already exists
      summary: Register a new user
      tags:
        - Auth
  /api/v1/auth/login:
    post:
      description: >-
        PUPIL and TEACHER log in by schoolsById; ADMIN logs in by id. Admins
        cannot register, only log in. Public endpoint, no auth required.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              pupil:
                summary: Pupil or teacher
                value:
                  role: PUPIL
                  schoolsById: school-user-123
              admin:
                summary: Admin
                value:
                  role: ADMIN
                  id: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
      responses:
        '200':
          description: JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation failed (missing schoolsById or id for the role)
        '401':
          description: No user with this role and identifier
      summary: Log in
      tags:
        - Auth
  /api/v1/users:
    post:
      description: >-
        Admin: any role (PUPIL/TEACHER need schoolsById and class; ADMIN must
        not have them). Teacher: PUPIL only, class is taken from the teacher.
        Pupil: forbidden.
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
            examples:
              teacherCreatesPupil:
                summary: Teacher creates a pupil of own class
                value:
                  schoolsById: school-user-789
                  name: Petr
                  surname: Petrov
                  fathersName: Ivanovich
                  role: PUPIL
              adminCreatesAdmin:
                summary: Admin creates an admin
                value:
                  name: Anna
                  surname: Admin
                  fathersName: Sergeevna
                  role: ADMIN
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed or school fields do not match the role
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not create this user
        '409':
          description: User with this schoolsById already exists
      security:
        - bearer: []
      summary: Create a user
      tags:
        - Users
    get:
      description: >-
        Admin: any user. Teacher: self and pupils of own class (same class).
        Pupil: self only.
      operationId: UsersController_findAll
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '401':
          description: Missing or invalid bearer token
      security:
        - bearer: []
      summary: List users the caller can manage
      tags:
        - Users
  /api/v1/users/{id}:
    get:
      description: >-
        Admin: any user. Teacher: self and pupils of own class (same class).
        Pupil: self only.
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
      security:
        - bearer: []
      summary: Get a user by id
      tags:
        - Users
    patch:
      description: >-
        Admin: any user. Teacher: self and pupils of own class (same class).
        Pupil: self only. Only an admin can change role, class, schoolsById;
        others change name, surname, fathersName.
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed or school fields do not match the role
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not change this user or these fields
        '404':
          description: User not found
        '409':
          description: User with this schoolsById already exists
      security:
        - bearer: []
      summary: Update a user
      tags:
        - Users
    delete:
      description: >-
        Admin: any user. Teacher: self and pupils of own class (same class).
        Pupil: self only.
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
      security:
        - bearer: []
      summary: Delete a user
      tags:
        - Users
  /api/v1/events:
    post:
      description: >-
        Pupil only. The event gets status ON_MODERATION and is sent to the
        teacher of the pupil's class.
      operationId: EventsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: Validation failed, or the pupil's class has no teacher
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '409':
          description: Event with this name already exists
      security:
        - bearer: []
      summary: Create an event request
      tags:
        - Events
  /api/v1/events/moderation:
    get:
      description: >-
        Teacher only. Events assigned to the caller with status ON_MODERATION,
        oldest first.
      operationId: EventsController_findForModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a teacher
      security:
        - bearer: []
      summary: Teacher's moderation list
      tags:
        - Events
  /api/v1/events/my:
    get:
      description: >-
        Pupil only. All events created by the caller, in any status, newest
        first, with the vote count.
      operationId: EventsController_findMine
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
        - bearer: []
      summary: Author's own events
      tags:
        - Events
  /api/v1/events/voting:
    get:
      description: >-
        Pupil only. ON_VOTE events whose scope includes the caller (relative to
        the initiator's class: CLASS - same class, GRADE - same grade, SCHOOL -
        any pupil), newest first, with the vote count and whether the caller has
        voted.
      operationId: EventsController_findForVoting
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
        - bearer: []
      summary: Pupil's voting list
      tags:
        - Events
  /api/v1/events/admin-moderation:
    get:
      description: >-
        Admin only. Events with status ON_ADMIN_MODERATION (passed the vote),
        oldest first.
      operationId: EventsController_findForAdminModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
      security:
        - bearer: []
      summary: Admin's moderation list
      tags:
        - Events
  /api/v1/events/{id}:
    get:
      description: Initiator, assigned teacher or admin.
      operationId: EventsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not read this event
        '404':
          description: Event not found
      security:
        - bearer: []
      summary: Get an event with all its data
      tags:
        - Events
  /api/v1/events/{id}/approve:
    post:
      description: Assigned teacher only. ON_MODERATION -> ON_VOTE.
      operationId: EventsController_approve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the assigned teacher
        '404':
          description: Event not found
        '409':
          description: >-
            Event is not on moderation anymore, or voting for it has closed (2
            days before the start)
      security:
        - bearer: []
      summary: Approve an event
      tags:
        - Events
  /api/v1/events/{id}/decline:
    post:
      description: >-
        Assigned teacher only. ON_MODERATION -> DECLINED, with an optional
        reason.
      operationId: EventsController_decline
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the assigned teacher
        '404':
          description: Event not found
        '409':
          description: >-
            Event is not on moderation anymore, or voting for it has closed (2
            days before the start)
      security:
        - bearer: []
      summary: Decline an event
      tags:
        - Events
  /api/v1/events/{id}/admin/approve:
    post:
      description: Admin only. ON_ADMIN_MODERATION -> FINALIZED.
      operationId: EventsController_adminApprove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or has already started
      security:
        - bearer: []
      summary: Admin approves an event
      tags:
        - Events
  /api/v1/events/{id}/admin/decline:
    post:
      description: >-
        Admin only. ON_ADMIN_MODERATION -> DECLINED_BY_ADMIN, with an optional
        reason.
      operationId: EventsController_adminDecline
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or has already started
      security:
        - bearer: []
      summary: Admin declines an event
      tags:
        - Events
  /api/v1/events/{id}/vote:
    post:
      description: >-
        Pupil only. The event must be ON_VOTE. One vote per pupil per event.
        Audience by scope, relative to the initiator's class: CLASS - same
        class, GRADE - same grade (first number of the class name), SCHOOL - any
        pupil.
      operationId: EventsController_vote
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventVoteResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil, or is outside the event's scope
        '404':
          description: Event not found
        '409':
          description: >-
            Event is not on vote, voting has closed (2 days before the start),
            or the pupil has already voted
      security:
        - bearer: []
      summary: Vote for an event
      tags:
        - Events
info:
  title: Minsk Hackathon Backend
  description: Backend documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: Health check status
      required:
        - ok
    RegisterDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: User ID in the school system (unique)
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        fathersName:
          type: string
          example: Petrovich
          description: Father's name
        role:
          type: string
          enum:
            - PUPIL
            - TEACHER
          example: PUPIL
          description: User role (PUPIL or TEACHER)
        class:
          type: string
          example: 10A
          description: Class name
      required:
        - schoolsById
        - name
        - surname
        - fathersName
        - role
        - class
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
        schoolsById:
          type: string
          example: school-user-123
          nullable: true
        name:
          type: string
          example: Ivan
        surname:
          type: string
          example: Ivanov
        fathersName:
          type: string
          example: Petrovich
        class:
          type: string
          example: 10A
          nullable: true
        role:
          type: string
          enum:
            - PUPIL
            - TEACHER
            - ADMIN
          example: PUPIL
      required:
        - id
        - schoolsById
        - name
        - surname
        - fathersName
        - class
        - role
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/UserResponseDto'
      required:
        - accessToken
        - user
    LoginDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - PUPIL
            - TEACHER
            - ADMIN
          example: PUPIL
          description: Role of the user logging in
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID. Required for PUPIL and TEACHER
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          description: User id (UUID). Required for ADMIN
      required:
        - role
    CreateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: >-
            School-system ID (unique). Required for PUPIL/TEACHER, forbidden for
            ADMIN
        name:
          type: string
          example: Ivan
        surname:
          type: string
          example: Ivanov
        fathersName:
          type: string
          example: Petrovich
        role:
          type: string
          enum:
            - PUPIL
            - TEACHER
            - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: >-
            Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to
            the teacher's class
      required:
        - name
        - surname
        - fathersName
        - role
    UpdateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: >-
            School-system ID (unique). Required for PUPIL/TEACHER, forbidden for
            ADMIN
        name:
          type: string
          example: Ivan
        surname:
          type: string
          example: Ivanov
        fathersName:
          type: string
          example: Petrovich
        role:
          type: string
          enum:
            - PUPIL
            - TEACHER
            - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: >-
            Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to
            the teacher's class
    CreateEventDto:
      type: object
      properties:
        name:
          type: string
          example: Class trip to the museum
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
        scope:
          type: string
          enum:
            - CLASS
            - GRADE
            - SCHOOL
          default: CLASS
          description: Who the event is for
        category:
          type: string
          enum:
            - SPORTS
            - INTELLECTUAL
            - CULTURAL
            - CREATIVE
            - EDUCATIONAL
            - VOLUNTEER
            - ENVIRONMENTAL
            - TOURISM
            - ENTERTAINMENT
            - OTHER
          example: SPORTS
          description: >-
            Kind of event: SPORTS - competitions, tournaments; INTELLECTUAL -
            olympiads, quizzes, debates; CULTURAL - theatre, museum, cinema;
            CREATIVE - concerts, contests, exhibitions; EDUCATIONAL - lectures,
            workshops; VOLUNTEER - charity, social help; ENVIRONMENTAL -
            clean-ups, tree planting; TOURISM - hikes, excursions, trips;
            ENTERTAINMENT - celebrations, discos, quests; OTHER - anything else
        voteThreshold:
          type: number
          example: 15
          minimum: 1
          maximum: 10000
          description: Votes needed during ON_VOTE to send the event to admin moderation
        startsAt:
          type: string
          example: '2026-12-01T10:00:00+03:00'
          description: >-
            When the event starts: ISO 8601 date-time with a timezone (Z or
            ±hh:mm), more than 2 days ahead. Voting closes 2 days before it: an
            event not approved and voted by then becomes EXPIRED. The admin may
            decide on a voted event until it starts
      required:
        - name
        - category
        - voteThreshold
        - startsAt
    EventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
        name:
          type: string
          example: Class trip to the museum
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          nullable: true
        scope:
          type: string
          enum:
            - CLASS
            - GRADE
            - SCHOOL
          example: CLASS
        category:
          type: string
          enum:
            - SPORTS
            - INTELLECTUAL
            - CULTURAL
            - CREATIVE
            - EDUCATIONAL
            - VOLUNTEER
            - ENVIRONMENTAL
            - TOURISM
            - ENTERTAINMENT
            - OTHER
          example: SPORTS
        status:
          type: string
          enum:
            - ON_MODERATION
            - DECLINED
            - ON_VOTE
            - EXPIRED
            - ON_ADMIN_MODERATION
            - FINALIZED
            - DECLINED_BY_ADMIN
          example: ON_MODERATION
        declineReason:
          type: string
          example: null
          nullable: true
          description: Set when declined (by the teacher or an admin) with a reason
        voteThreshold:
          type: number
          example: 15
          description: Votes needed to move from ON_VOTE to ON_ADMIN_MODERATION
        startsAt:
          format: date-time
          type: string
          example: '2026-12-01T07:00:00.000Z'
          description: When the event starts (UTC)
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-11-29T07:00:00.000Z'
          description: >-
            Computed: 2 days before startsAt. Voting and teacher moderation must
            finish by then, otherwise the event becomes EXPIRED
        initiator:
          description: Pupil who created the event
          allOf:
            - $ref: '#/components/schemas/UserResponseDto'
        teacher:
          description: Teacher who moderates the event
          allOf:
            - $ref: '#/components/schemas/UserResponseDto'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - scope
        - category
        - status
        - declineReason
        - voteThreshold
        - startsAt
        - votingClosesAt
        - initiator
        - teacher
        - createdAt
        - updatedAt
    VotingEventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
        name:
          type: string
          example: Class trip to the museum
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          nullable: true
        scope:
          type: string
          enum:
            - CLASS
            - GRADE
            - SCHOOL
          example: CLASS
        category:
          type: string
          enum:
            - SPORTS
            - INTELLECTUAL
            - CULTURAL
            - CREATIVE
            - EDUCATIONAL
            - VOLUNTEER
            - ENVIRONMENTAL
            - TOURISM
            - ENTERTAINMENT
            - OTHER
          example: SPORTS
        status:
          type: string
          enum:
            - ON_MODERATION
            - DECLINED
            - ON_VOTE
            - EXPIRED
            - ON_ADMIN_MODERATION
            - FINALIZED
            - DECLINED_BY_ADMIN
          example: ON_MODERATION
        declineReason:
          type: string
          example: null
          nullable: true
          description: Set when declined (by the teacher or an admin) with a reason
        voteThreshold:
          type: number
          example: 15
          description: Votes needed to move from ON_VOTE to ON_ADMIN_MODERATION
        startsAt:
          format: date-time
          type: string
          example: '2026-12-01T07:00:00.000Z'
          description: When the event starts (UTC)
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-11-29T07:00:00.000Z'
          description: >-
            Computed: 2 days before startsAt. Voting and teacher moderation must
            finish by then, otherwise the event becomes EXPIRED
        initiator:
          description: Pupil who created the event
          allOf:
            - $ref: '#/components/schemas/UserResponseDto'
        teacher:
          description: Teacher who moderates the event
          allOf:
            - $ref: '#/components/schemas/UserResponseDto'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        votesCount:
          type: number
          example: 4
          description: Votes cast so far
        hasVoted:
          type: boolean
          example: false
          description: Whether the caller has already voted
      required:
        - id
        - name
        - description
        - scope
        - category
        - status
        - declineReason
        - voteThreshold
        - startsAt
        - votingClosesAt
        - initiator
        - teacher
        - createdAt
        - updatedAt
        - votesCount
        - hasVoted
    DeclineEventDto:
      type: object
      properties:
        reason:
          type: string
          example: Please pick another date
          description: Optional reason shown to the pupil
    EventVoteResponseDto:
      type: object
      properties:
        eventId:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
        votesCount:
          type: number
          example: 12
          description: Total number of votes for the event after this vote
        voteThreshold:
          type: number
          example: 15
        status:
          type: string
          enum:
            - ON_MODERATION
            - DECLINED
            - ON_VOTE
            - EXPIRED
            - ON_ADMIN_MODERATION
            - FINALIZED
            - DECLINED_BY_ADMIN
          example: ON_VOTE
          description: >-
            Status after this vote: ON_ADMIN_MODERATION once the threshold is
            reached
      required:
        - eventId
        - votesCount
        - voteThreshold
        - status
