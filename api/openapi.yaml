        initiator:
          description: Pupil who created the event
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
        teacher:
          description: Teacher who moderates the event
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
        createdAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: When the request was created (UTC)
        updatedAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: Last change (UTC)
        votesCount:
          type: integer
          example: 4
          description: Votes cast so far
        hasVoted:
          type: boolean
          example: false
          description: Whether the caller has already voted
      required:
      - id
      - name
      - description
      - scope
      - category
      - status
      - declineReason
      - voteThreshold
      - startsAt
      - votingClosesAt
      - successProbability
      - imageUrl
      - ratingAverage
      - ratingsCount
