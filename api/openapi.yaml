openapi: 3.0.0
paths:
  /api/v1:
    get:
      description: Plain-text greeting; use GET /health to check the service.
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: Greeting text
          content:
            application/json:
              schema:
                type: string
                example: Hello World!!
      summary: Greeting
      tags:
      - App
  /api/v1/health:
    get:
      operationId: HealthController_healthcheck
      parameters: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
      summary: Health check
      tags:
      - Health
  /api/v1/auth/register:
    post:
      description: If a user with this schoolsById exists (ADMIN included), logs them in and ignores the
        other fields. Otherwise creates a new user from name, surname and role (required then); class
        is required for PUPIL/TEACHER and must be omitted for ADMIN. A pupil may register into a class
        that has no teacher yet; their events wait for one, and every teacher of the class (also one who
        registers later) moderates them. Returns a JWT access token either way. Public endpoint, no auth
        required.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
            examples:
              existing:
                summary: Existing user of any role, ADMIN included (log in)
                value:
                  schoolsById: school-user-123
              pupil:
                summary: New pupil
                value:
                  schoolsById: school-user-123
                  name: Ivan
                  surname: Ivanov
                  role: PUPIL
                  class: 10A
              admin:
                summary: New admin
                value:
                  schoolsById: admin-001
                  name: Olga
                  surname: Kovaleva
                  role: ADMIN
              teacher:
                summary: New teacher
                value:
                  schoolsById: school-user-456
                  name: Maria
                  surname: Sidorova
                  role: TEACHER
                  class: 10A
      responses:
        '201':
          description: User logged in or created; JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation failed (invalid fields, blank class, unknown fields), a new user is
            missing name/surname/role/class, or a new ADMIN was given a class
        '403':
          description: Existing PUPIL or TEACHER has no class assigned
      summary: Register or log in (PUPIL / TEACHER / ADMIN)
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: Every role logs in by schoolsById. Public endpoint, no auth required.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              pupil:
                summary: Pupil or teacher
                value:
                  role: PUPIL
                  schoolsById: school-user-123
              admin:
                summary: Admin
                value:
                  role: ADMIN
                  schoolsById: admin-001
      responses:
        '200':
          description: JWT and user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Validation failed (missing schoolsById or unknown role)
        '401':
          description: No user with this role and identifier
        '403':
          description: PUPIL or TEACHER has no class assigned
      summary: Log in
      tags:
      - Auth
  /api/v1/users:
    post:
      description: 'Admin: any role (every role needs schoolsById; PUPIL/TEACHER need a class, ADMIN must
        not have one). Teacher: PUPIL only, class is taken from the teacher. Pupil: forbidden.'
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
            examples:
              teacherCreatesPupil:
                summary: Teacher creates a pupil of own class
                value:
                  schoolsById: school-user-789
                  name: Petr
                  surname: Petrov
                  role: PUPIL
              adminCreatesAdmin:
                summary: Admin creates an admin
                value:
                  schoolsById: admin-002
                  name: Anna
                  surname: Admin
                  role: ADMIN
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Validation failed or class does not match the role
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not create this user
        '409':
          description: User with this schoolsById already exists
      security:
      - bearer: []
      summary: Create a user
      tags:
      - Users
    get:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_findAll
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: List users the caller can manage
      tags:
      - Users
  /api/v1/users/{id}:
    get:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
      security:
      - bearer: []
      summary: Get a user by id
      tags:
      - Users
    patch:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.
        Only an admin can change role, class, schoolsById; others change name and surname.'
      operationId: UsersController_update
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or validation failed, or school fields do not match
            the role'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not change this user or these fields
        '404':
          description: User not found
        '409':
          description: User with this schoolsById already exists
      security:
      - bearer: []
      summary: Update a user
      tags:
      - Users
    delete:
      description: 'Admin: any user. Teacher: self and pupils of own class (same class). Pupil: self only.'
      operationId: UsersController_remove
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not manage this user
        '404':
          description: User not found
        '409':
          description: User is referenced by other records (e.g. created or moderates events)
      security:
      - bearer: []
      summary: Delete a user
      tags:
      - Users
  /api/v1/events:
    post:
      description: 'Any role; the role picks the flow (createdByRole in the response).


        PUPIL: status ON_MODERATION, moderated by every teacher of the pupil''s class (they all get a
        push). No date: an admin sets startsAt on approval. votingClosesAt = createdAt + 1 month: teacher
        moderation, voting and the admin decision must finish by then.


        TEACHER (school event): no teacher moderation, status ON_VOTE at once; scope relative to the teacher''s
        class. On voteThreshold votes -> ON_ADMIN_MODERATION, then the admin approves with a date or declines.
        Same deadline: createdAt + 1 month.


        ADMIN (school event): no moderation, scope SCHOOL, startsAt required (in the future). Status ON_VOTE;
        on voteThreshold votes -> FINALIZED, otherwise EXPIRED at startsAt (votingClosesAt = startsAt).'
      operationId: EventsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Validation failed (incl. an unknown field); startsAt sent by a pupil or teacher;
            admin: startsAt missing or not in the future, or scope other than SCHOOL; pupil or teacher
            without a class'
        '401':
          description: Missing or invalid bearer token
        '409':
          description: Event with this name already exists
      security:
      - bearer: []
      summary: Create an event
      tags:
      - Events
  /api/v1/events/probability:
    get:
      description: 'Any authenticated user. Computed from FINALIZED events of the same category (the only
        ones with a date set by an admin), even if they have not started yet. With startsAt only the start
        time of day (Minsk time) is compared, not the date; without it every such event counts fully.
        At least 5 such events (at the same time): 0.9; no history: 0.5.'
      operationId: EventsController_previewProbability
      parameters:
      - name: category
        required: true
        in: query
        description: Kind of event
        schema:
          example: SPORTS
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
      - name: startsAt
        required: false
        in: query
        description: 'Optional planned start, e.g. the date an admin is about to set: ISO 8601 date-time
          with a timezone (Z or ±hh:mm). In a URL encode "+" as %2B, e.g. 2026-12-05T12:00:00%2B03:00.
          Without it the start time is not compared'
        schema:
          format: date-time
          example: '2026-12-05T12:00:00+03:00'
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbabilityResponseDto'
        '400':
          description: Invalid category, or startsAt is given but is not a date-time with a timezone
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Preview the probability that an event takes place
      tags:
      - Events
  /api/v1/events/moderation:
    get:
      description: Teacher only. Events of pupils of the caller's class with status ON_MODERATION, oldest
        first. Events past their deadline (a month after creation) are hidden.
      operationId: EventsController_findForModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a teacher
      security:
      - bearer: []
      summary: Teacher's moderation list
      tags:
      - Events
  /api/v1/events/my:
    get:
      description: Any role. All events created by the caller, in any status, newest first, with the vote
        count.
      operationId: EventsController_findMine
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Author's own events
      tags:
      - Events
  /api/v1/events/voting:
    get:
      description: 'Pupil only. ON_VOTE events whose scope includes the caller (relative to the initiator''s
        class: CLASS - same class, GRADE - same grade, SCHOOL - any pupil) and whose voting is still open,
        newest first, with the vote count and whether the caller has voted.'
      operationId: EventsController_findForVoting
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotingEventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
      security:
      - bearer: []
      summary: Pupil's voting list
      tags:
      - Events
  /api/v1/events/admin-moderation:
    get:
      description: Admin only. Events with status ON_ADMIN_MODERATION (passed the vote), oldest first.
        Events past their deadline (a month after creation) are hidden.
      operationId: EventsController_findForAdminModeration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
      security:
      - bearer: []
      summary: Admin's moderation list
      tags:
      - Events
  /api/v1/events/{id}:
    get:
      description: Initiator, any teacher of the initiator's class, or admin.
      operationId: EventsController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller may not read this event
        '404':
          description: Event not found
      security:
      - bearer: []
      summary: Get an event with all its data
      tags:
      - Events
  /api/v1/events/{id}/approve:
    post:
      description: Any teacher of the author's class. ON_MODERATION -> ON_VOTE. The first decision wins.
      operationId: EventsController_approve
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a teacher of the author's class
        '404':
          description: Event not found
        '409':
          description: Event is not on moderation anymore, or its deadline (a month after creation) has
            passed
      security:
      - bearer: []
      summary: Approve an event
      tags:
      - Events
  /api/v1/events/{id}/decline:
    post:
      description: Any teacher of the author's class. ON_MODERATION -> DECLINED, with an optional reason.
        The first decision wins.
      operationId: EventsController_decline
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or reason is empty or longer than 2000 characters'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a teacher of the author's class
        '404':
          description: Event not found
        '409':
          description: Event is not on moderation anymore, or its deadline (a month after creation) has
            passed
      security:
      - bearer: []
      summary: Decline an event
      tags:
      - Events
  /api/v1/events/{id}/admin/approve:
    post:
      description: Admin only. ON_ADMIN_MODERATION -> FINALIZED. The admin sets the date (startsAt, in
        the future); it cannot be changed afterwards.
      operationId: EventsController_adminApprove
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminApproveEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or startsAt is missing, has no timezone, or is not
            in the future'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or its deadline (a month after creation) has
            passed
      security:
      - bearer: []
      summary: Admin approves an event
      tags:
      - Events
  /api/v1/events/{id}/admin/decline:
    post:
      description: Admin only. ON_ADMIN_MODERATION -> DECLINED_BY_ADMIN, with an optional reason.
      operationId: EventsController_adminDecline
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or reason is empty or longer than 2000 characters'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an admin
        '404':
          description: Event not found
        '409':
          description: Event is not on admin moderation, or its deadline (a month after creation) has
            passed
      security:
      - bearer: []
      summary: Admin declines an event
      tags:
      - Events
  /api/v1/events/{id}/image:
    put:
      description: 'Author only, while the event is pending (ON_MODERATION, ON_VOTE, ON_ADMIN_MODERATION)
        and not past its deadline. An event has at most one image: a new upload replaces and deletes the
        previous one. multipart/form-data, field "file": image/jpeg, image/png, image/webp, image/gif,
        up to 5 MB; the type is checked by the file content.'
      operationId: EventsController_setImage
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP or GIF, up to 5 MB
      responses:
        '200':
          description: The event with its new imageUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID, or the file is missing, or is not a JPEG/PNG/WebP/GIF
            image'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not the author
        '404':
          description: Event not found
        '409':
          description: The event is already decided (or past its deadline)
        '413':
          description: File is larger than 5 MB
        '502':
          description: The image storage (Cloudinary) rejected the upload
      security:
      - bearer: []
      summary: Set or replace the event image
      tags:
      - Events
    delete:
      description: Author while the event is pending and not past its deadline; an admin in any status.
        Does nothing if the event has no image.
      operationId: EventsController_removeImage
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: The event, imageUrl is null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is neither the author nor an admin
        '404':
          description: Event not found
        '409':
          description: 'Author: the event is already decided (or past its deadline)'
      security:
      - bearer: []
      summary: Remove the event image
      tags:
      - Events
  /api/v1/events/{id}/vote:
    post:
      description: 'Pupil only. The event must be ON_VOTE and voting must be open (until votingClosesAt:
        a month after the event was created, or startsAt of an admin event). One vote per pupil per event.
        Audience by scope, relative to the initiator''s class: CLASS - same class, GRADE - same grade
        (first number of the class name), SCHOOL - any pupil. The vote that reaches voteThreshold moves
        the event to ON_ADMIN_MODERATION, or an admin event to FINALIZED.'
      operationId: EventsController_vote
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventVoteResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil, or is outside the event's scope
        '404':
          description: Event not found
        '409':
          description: Event is not on vote, voting has closed (votingClosesAt has passed), or the pupil
            has already voted
      security:
      - bearer: []
      summary: Vote for an event
      tags:
      - Events
    delete:
      description: 'Pupil only, and only the pupil who voted. The event must still be ON_VOTE and voting
        must be open (until votingClosesAt): once the threshold has moved the event on (ON_ADMIN_MODERATION
        or FINALIZED), its votes stay. The pupil can vote again afterwards.'
      operationId: EventsController_unvote
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventVoteResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '404':
          description: Event not found
        '409':
          description: Event is not on vote, voting has closed, or the pupil has not voted for it
      security:
      - bearer: []
      summary: Take the vote back (unsubscribe from the event)
      tags:
      - Events
  /api/v1/events/{id}/like:
    put:
      description: 'Pupil only, any pupil: the event scope does not limit who likes. The event must be
        approved by the teacher: ON_VOTE, ON_ADMIN_MODERATION, FINALIZED or DECLINED_BY_ADMIN. One like
        per pupil per event: liking again changes nothing.'
      operationId: EventsController_like
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLikeResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '404':
          description: Event not found
        '409':
          description: Event is ON_MODERATION, DECLINED or EXPIRED
      security:
      - bearer: []
      summary: Like an event (+1)
      tags:
      - Events
    delete:
      description: Pupil only, in any status of the event. Does nothing if the caller has not liked it.
      operationId: EventsController_unlike
      parameters:
      - name: id
        required: true
        in: path
        schema:
          format: uuid
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLikeResponseDto'
        '400':
          description: 'Invalid id: must be a UUID'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not a pupil
        '404':
          description: Event not found
      security:
      - bearer: []
      summary: Take the like back (-1)
      tags:
      - Events
  /api/v1/device-token:
    post:
      description: Call on login and on every app start. Any role. A token registered by another user
        moves to the caller. With deviceId, a previous token of the same device is replaced.
      operationId: DeviceTokensController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceTokenDto'
      responses:
        '204':
          description: Saved
        '400':
          description: Validation failed
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Save or refresh the FCM token of this device
      tags:
      - Push notifications
    delete:
      description: Call on logout, before dropping the JWT, so the device stops getting this user's pushes.
        The token is sent in the JSON body. Idempotent.
      operationId: DeviceTokensController_remove
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDeviceTokenDto'
      responses:
        '204':
          description: Deleted, or there was no such token of the caller
        '400':
          description: Validation failed
        '401':
          description: Missing or invalid bearer token
      security:
      - bearer: []
      summary: Delete the FCM token of this device
      tags:
      - Push notifications
info:
  title: Minsk Hackathon Backend
  description: Backend documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: Health check status
      required:
      - ok
    RegisterDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: User ID in the school system (unique)
        name:
          type: string
          example: Ivan
          description: First name. Required for a new user
        surname:
          type: string
          example: Ivanov
          description: Last name. Required for a new user
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: User role (PUPIL, TEACHER or ADMIN). Required for a new user
        class:
          type: string
          example: 10A
          description: Class name; surrounding spaces are trimmed, must not be blank. Required for a new
            PUPIL/TEACHER, forbidden for ADMIN
      required:
      - schoolsById
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        schoolsById:
          type: string
          example: school-user-123
          description: User ID in the school system (unique)
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        class:
          type: string
          example: 10A
          nullable: true
          description: Class; always set for PUPIL and TEACHER, null for ADMIN
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: User role
      required:
      - id
      - schoolsById
      - name
      - surname
      - class
      - role
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjJjIn0.signature
          description: 'JWT access token: send it as "Authorization: Bearer <token>"'
        user:
          description: The logged-in user
          allOf:
          - $ref: '#/components/schemas/UserResponseDto'
      required:
      - accessToken
      - user
    LoginDto:
      type: object
      properties:
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: Role of the user logging in
        schoolsById:
          type: string
          example: school-user-123
          description: User ID in the school system
      required:
      - role
      - schoolsById
    CreateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID (unique)
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to the teacher's
            class. Surrounding spaces are trimmed, must not be blank
      required:
      - schoolsById
      - name
      - surname
      - role
    UpdateUserDto:
      type: object
      properties:
        schoolsById:
          type: string
          example: school-user-123
          description: School-system ID (unique)
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
        role:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: A teacher can only create PUPIL
        class:
          type: string
          example: 10A
          description: Class. Required for PUPIL/TEACHER, forbidden for ADMIN. Defaults to the teacher's
            class. Surrounding spaces are trimmed, must not be blank
    CreateEventDto:
      type: object
      properties:
        name:
          type: string
          example: Class trip to the museum
          maxLength: 200
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          maxLength: 5000
          description: Free-form details
        scope:
          type: string
          enum:
          - CLASS
          - GRADE
          - SCHOOL
          default: CLASS
          description: 'Who may vote, relative to the author''s class: CLASS - same class, GRADE - same
            grade (first number of the class name), SCHOOL - any pupil. Pupil and teacher: any, CLASS
            by default. Admin: SCHOOL only, and by default (an admin has no class)'
        category:
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
          example: SPORTS
          description: 'Kind of event: SPORTS - competitions, tournaments; INTELLECTUAL - olympiads, quizzes,
            debates; CULTURAL - theatre, museum, cinema; CREATIVE - concerts, contests, exhibitions; EDUCATIONAL
            - lectures, workshops; VOLUNTEER - charity, social help; ENVIRONMENTAL - clean-ups, tree planting;
            TOURISM - hikes, excursions, trips; ENTERTAINMENT - celebrations, discos, quests; OTHER -
            anything else'
        voteThreshold:
          type: integer
          example: 15
          minimum: 1
          maximum: 10000
          description: 'Votes needed during ON_VOTE: they send a pupil or teacher event to admin moderation,
            and make an admin event FINALIZED'
        startsAt:
          type: string
          example: '2026-12-05T12:00:00+03:00'
          format: date-time
          description: 'Admin only, and required for an admin: when the school event takes place, ISO
            8601 date-time with a timezone (Z or ±hh:mm), in the future. It is also the voting deadline:
            without enough votes by then the event becomes EXPIRED. Never changed afterwards. A pupil
            or teacher must not send it: their date is set by the admin on approval'
      required:
      - name
      - category
      - voteThreshold
    EventUserResponseDto:
      type: object
      properties:
        name:
          type: string
          example: Ivan
          description: First name
        surname:
          type: string
          example: Ivanov
          description: Last name
      required:
      - name
      - surname
    EventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        name:
          type: string
          example: Class trip to the museum
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          nullable: true
          description: Free-form details
        scope:
          type: string
          enum:
          - CLASS
          - GRADE
          - SCHOOL
          example: CLASS
          description: 'Who may vote, relative to the author''s class: CLASS, GRADE or SCHOOL'
        category:
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
          example: SPORTS
          description: Kind of event
        status:
          type: string
          enum:
          - ON_MODERATION
          - DECLINED
          - ON_VOTE
          - EXPIRED
          - ON_ADMIN_MODERATION
          - FINALIZED
          - DECLINED_BY_ADMIN
          example: ON_MODERATION
          description: 'Pupil event: ON_MODERATION (teacher) -> ON_VOTE (pupils) -> ON_ADMIN_MODERATION
            (admin) -> FINALIZED. Teacher event: starts ON_VOTE, then the same (never ON_MODERATION or
            DECLINED). Admin event: ON_VOTE -> FINALIZED when the votes reach voteThreshold, otherwise
            EXPIRED at startsAt. DECLINED / DECLINED_BY_ADMIN: rejected by the teacher / admin. EXPIRED:
            not decided before its deadline (votingClosesAt)'
        createdByRole:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: Role of the initiator when the event was created, it picks the flow (see status).
            TEACHER and ADMIN events are school events created by the staff
        declineReason:
          type: string
          example: null
          nullable: true
          description: Set when declined (by the teacher or an admin) with a reason
        voteThreshold:
          type: integer
          example: 15
          description: 'Votes needed to leave ON_VOTE: to ON_ADMIN_MODERATION (pupil and teacher events),
            to FINALIZED (admin events)'
        startsAt:
          format: date-time
          type: string
          example: null
          nullable: true
          description: 'When the event starts (UTC). Pupil and teacher events: set by the admin on approval,
            null in every status except FINALIZED. Admin events: set on creation, present in every status'
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-12-06T10:00:00.000Z'
          description: 'Computed. Pupil and teacher events: createdAt + 1 month (30 days), teacher moderation,
            voting and the admin decision must finish by then. Admin events: startsAt, the votes must
            reach voteThreshold by then. Otherwise the event becomes EXPIRED'
        successProbability:
          type: number
          example: 0.66
          minimum: 0
          maximum: 1
          description: 'Computed: probability (0..1) that the event takes place, from other FINALIZED
            events of the same category (also not yet started ones), the only ones with a date. For a
            FINALIZED event, weighted by how close their start time of day (Minsk time) is; before the
            date is set, the time is not compared. 0.9 with at least 5 such events (at the same time);
            0.5 without history'
        imageUrl:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/v1/minsk_hackathon_images/3f2c9a4e.jpg
          nullable: true
          description: Event image URL; null when the event has none. At most one image per event
        likesCount:
          type: integer
          example: 12
          description: Number of likes. Any pupil may like an event from ON_VOTE on, once, and take the
            like back
        initiator:
          description: 'Who created the event: a pupil, a teacher or an admin (see createdByRole)'
          allOf:
          - $ref: '#/components/schemas/EventUserResponseDto'
        moderators:
          description: 'Who may decide on the event now. ON_MODERATION: every teacher of the author''s
            class (empty while the class has none: a teacher who registers into it moderates the event
            at once). ON_ADMIN_MODERATION: every admin. Empty in every other status (admin events are
            never moderated)'
          type: array
          items:
            $ref: '#/components/schemas/EventUserResponseDto'
        voters:
          description: Pupils who voted for (signed up to) the event, in the order they voted
          type: array
          items:
            $ref: '#/components/schemas/EventUserResponseDto'
        votesCount:
          type: integer
          example: 4
          description: 'Votes cast so far: the length of voters'
        createdAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: When the request was created (UTC)
        updatedAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: Last change (UTC)
      required:
      - id
      - name
      - description
      - scope
      - category
      - status
      - createdByRole
      - declineReason
      - voteThreshold
      - startsAt
      - votingClosesAt
      - successProbability
      - imageUrl
      - likesCount
      - initiator
      - moderators
      - voters
      - votesCount
      - createdAt
      - updatedAt
    ProbabilityResponseDto:
      type: object
      properties:
        successProbability:
          type: number
          example: 0.66
          minimum: 0
          maximum: 1
          description: Probability (0..1) that such an event takes place, same rule as EventResponseDto.successProbability
      required:
      - successProbability
    VotingEventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        name:
          type: string
          example: Class trip to the museum
          description: Event name (unique)
        description:
          type: string
          example: Saturday, 10:00, meeting at school
          nullable: true
          description: Free-form details
        scope:
          type: string
          enum:
          - CLASS
          - GRADE
          - SCHOOL
          example: CLASS
          description: 'Who may vote, relative to the author''s class: CLASS, GRADE or SCHOOL'
        category:
          type: string
          enum:
          - SPORTS
          - INTELLECTUAL
          - CULTURAL
          - CREATIVE
          - EDUCATIONAL
          - VOLUNTEER
          - ENVIRONMENTAL
          - TOURISM
          - ENTERTAINMENT
          - OTHER
          example: SPORTS
          description: Kind of event
        status:
          type: string
          enum:
          - ON_MODERATION
          - DECLINED
          - ON_VOTE
          - EXPIRED
          - ON_ADMIN_MODERATION
          - FINALIZED
          - DECLINED_BY_ADMIN
          example: ON_MODERATION
          description: 'Pupil event: ON_MODERATION (teacher) -> ON_VOTE (pupils) -> ON_ADMIN_MODERATION
            (admin) -> FINALIZED. Teacher event: starts ON_VOTE, then the same (never ON_MODERATION or
            DECLINED). Admin event: ON_VOTE -> FINALIZED when the votes reach voteThreshold, otherwise
            EXPIRED at startsAt. DECLINED / DECLINED_BY_ADMIN: rejected by the teacher / admin. EXPIRED:
            not decided before its deadline (votingClosesAt)'
        createdByRole:
          type: string
          enum:
          - PUPIL
          - TEACHER
          - ADMIN
          example: PUPIL
          description: Role of the initiator when the event was created, it picks the flow (see status).
            TEACHER and ADMIN events are school events created by the staff
        declineReason:
          type: string
          example: null
          nullable: true
          description: Set when declined (by the teacher or an admin) with a reason
        voteThreshold:
          type: integer
          example: 15
          description: 'Votes needed to leave ON_VOTE: to ON_ADMIN_MODERATION (pupil and teacher events),
            to FINALIZED (admin events)'
        startsAt:
          format: date-time
          type: string
          example: null
          nullable: true
          description: 'When the event starts (UTC). Pupil and teacher events: set by the admin on approval,
            null in every status except FINALIZED. Admin events: set on creation, present in every status'
        votingClosesAt:
          format: date-time
          type: string
          example: '2026-12-06T10:00:00.000Z'
          description: 'Computed. Pupil and teacher events: createdAt + 1 month (30 days), teacher moderation,
            voting and the admin decision must finish by then. Admin events: startsAt, the votes must
            reach voteThreshold by then. Otherwise the event becomes EXPIRED'
        successProbability:
          type: number
          example: 0.66
          minimum: 0
          maximum: 1
          description: 'Computed: probability (0..1) that the event takes place, from other FINALIZED
            events of the same category (also not yet started ones), the only ones with a date. For a
            FINALIZED event, weighted by how close their start time of day (Minsk time) is; before the
            date is set, the time is not compared. 0.9 with at least 5 such events (at the same time);
            0.5 without history'
        imageUrl:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/v1/minsk_hackathon_images/3f2c9a4e.jpg
          nullable: true
          description: Event image URL; null when the event has none. At most one image per event
        likesCount:
          type: integer
          example: 12
          description: Number of likes. Any pupil may like an event from ON_VOTE on, once, and take the
            like back
        initiator:
          description: 'Who created the event: a pupil, a teacher or an admin (see createdByRole)'
          allOf:
          - $ref: '#/components/schemas/EventUserResponseDto'
        moderators:
          description: 'Who may decide on the event now. ON_MODERATION: every teacher of the author''s
            class (empty while the class has none: a teacher who registers into it moderates the event
            at once). ON_ADMIN_MODERATION: every admin. Empty in every other status (admin events are
            never moderated)'
          type: array
          items:
            $ref: '#/components/schemas/EventUserResponseDto'
        voters:
          description: Pupils who voted for (signed up to) the event, in the order they voted
          type: array
          items:
            $ref: '#/components/schemas/EventUserResponseDto'
        votesCount:
          type: integer
          example: 4
          description: 'Votes cast so far: the length of voters'
        createdAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: When the request was created (UTC)
        updatedAt:
          format: date-time
          type: string
          example: '2026-11-06T10:00:00.000Z'
          description: Last change (UTC)
        hasVoted:
          type: boolean
          example: false
          description: Whether the caller has already voted
        likedByMe:
          type: boolean
          example: false
          description: Whether the caller has liked the event (the count is likesCount)
      required:
      - id
      - name
      - description
      - scope
      - category
      - status
      - createdByRole
      - declineReason
      - voteThreshold
      - startsAt
      - votingClosesAt
      - successProbability
      - imageUrl
      - likesCount
      - initiator
      - moderators
      - voters
      - votesCount
      - createdAt
      - updatedAt
      - hasVoted
      - likedByMe
    DeclineEventDto:
      type: object
      properties:
        reason:
          type: string
          example: Please pick another date
          minLength: 1
          maxLength: 2000
          description: Optional reason shown to the pupil
    AdminApproveEventDto:
      type: object
      properties:
        startsAt:
          type: string
          example: '2026-12-05T12:00:00+03:00'
          format: date-time
          description: 'When the event takes place: ISO 8601 date-time with a timezone (Z or ±hh:mm),
            in the future. Set once, on approval: nobody can change it afterwards'
      required:
      - startsAt
    EventVoteResponseDto:
      type: object
      properties:
        eventId:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        votesCount:
          type: integer
          example: 12
          description: Total number of votes for the event after this vote (or after it was taken back)
        voteThreshold:
          type: integer
          example: 15
          description: Votes needed to move the event to ON_ADMIN_MODERATION
        status:
          type: string
          enum:
          - ON_MODERATION
          - DECLINED
          - ON_VOTE
          - EXPIRED
          - ON_ADMIN_MODERATION
          - FINALIZED
          - DECLINED_BY_ADMIN
          example: ON_VOTE
          description: 'Status after this vote: ON_ADMIN_MODERATION once the threshold is reached'
      required:
      - eventId
      - votesCount
      - voteThreshold
      - status
    EventLikeResponseDto:
      type: object
      properties:
        eventId:
          type: string
          example: 3f2c9a4e-1b7d-4e8a-9c0f-2a6b5d7e8f90
          format: uuid
        liked:
          type: boolean
          example: true
          description: true after PUT (like), false after DELETE (unlike)
        likesCount:
          type: integer
          example: 12
          description: Number of likes of the event
      required:
      - eventId
      - liked
      - likesCount
    RegisterDeviceTokenDto:
      type: object
      properties:
        token:
          type: string
          example: fcm-registration-token-from-firebase-messaging-getToken
          maxLength: 4096
          description: FCM registration token of this app install
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
          - WEB
          example: ANDROID
        deviceId:
          type: string
          example: 5f8a2c1e-device-install-id
          maxLength: 255
          description: Stable id of the app install. When the token of this device is refreshed, the old
            one is replaced.
      required:
      - token
    DeleteDeviceTokenDto:
      type: object
      properties:
        token:
          type: string
          example: fcm-registration-token-from-firebase-messaging-getToken
          maxLength: 4096
          description: FCM registration token to stop sending pushes to
      required:
      - token
